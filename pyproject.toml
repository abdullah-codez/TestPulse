[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testpulse"
version = "0.1.0"
description = "Agentic QA platform for AI-built applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web framework & server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",

    # Data validation & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database — SQLite async
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",

    # Orchestration
    "langgraph>=0.2.0",

    # MCP (Model Context Protocol)
    "mcp>=1.0.0",

    # AST parsing & graph analysis
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "networkx>=3.3",

    # Vector store (local mode — no Docker)
    "qdrant-client>=1.10.0",

    # LLM gateway
    "litellm>=1.40.0",

    # Structured logging
    "structlog>=24.2.0",

    # Async utilities
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pyright>=1.1.350",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
reportMissingModuleSource = false

